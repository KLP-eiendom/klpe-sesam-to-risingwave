services:
  risingwave:
    image: risingwavelabs/risingwave:v3.0.2
    command: playground
    ports:
      - "4566:4566"   # PostgreSQL-compatible frontend (used by dbt profiles.yml)
      - "5690:5690"   # gRPC meta
      - "5691:5691"   # dashboard
    environment:
      RUST_LOG: "warn"
      RW_CONFIG_PATH: "/risingwave.toml"
    volumes:
      - ./risingwave.toml:/risingwave.toml
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:5691/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Test MySQL CDC source (mirrors Forvalter/Kundeportal connector config)
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: testdb
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Test Postgres CDC source (mirrors Camunda connector config)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: testdb
    command: postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
