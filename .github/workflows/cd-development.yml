name: CD · development
run-name: Development ← ${{ github.ref_name }}

# ── push → main: build + deploy to development ───────────────────────────────
# Companions: release-check.yml (the pre-merge label gate), cd-release.yml
# (push → release), cd-manual.yml (workflow_dispatch: rollback / branch builds).
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # ALLOWLIST, deliberately mirroring the `changes` job below — the two must
    # stay in lockstep, and the job is authoritative. This was an exclusion
    # list, which silently disagreed with the release path: `scripts/**` was
    # never in it, so a one-file SQL change (PR #14, grant_privileges_
    # risingwave.sql) rebuilt and redeployed all TEN apps to development while
    # the release gate correctly called the same change non-deployable.
    #
    # An allowlist also fails the safe way round for a repo of this shape: a
    # NEW top-level directory does not deploy until someone says it should,
    # rather than deploying because nobody remembered to exclude it.
    #
    # Filtering here as well as in the job is not redundant — it costs ZERO
    # runners when it skips, where the job gate costs one. The job gate then
    # catches whatever the trigger lets through (a README inside src/, say).
    paths:
      - "src/**"
      - "kubernetes/**"

jobs:
  # ── The single source of truth for what this repo deploys ─────────────────
  # `all` — every app, used for development and for manual dispatch.
  # `promotable` — apps that exist beyond dev, used for staging and
  # production. Kept as a separate output from `all` so an app that should
  # stop (or start) at dev-only can be included or excluded here without
  # touching every build/deploy/promote job below.
  #
  # ubuntu-latest and no `if:`: this job gates every other one through `needs`,
  # so it must run for all three trigger shapes. It is seconds of a cheap
  # runner and never touches the ARC pool.
  apps:
    name: Resolve app matrix
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.list.outputs.all }}
      promotable: ${{ steps.list.outputs.promotable }}
    steps:
      - id: list
        shell: bash
        run: |
          # image        → GCR repository, and what backend-worker-cd calls worker_name
          # job_stem     → Cloud Run job name WITHOUT the -<env> suffix (jobs are
          #                suffixed per environment: -dev / -test / -prod)
          # service      → Cloud Run service name (NOT suffixed, and NOT the image
          #                name: image kdi-risingwv-data-api runs as service
          #                kdi-risingwave-data-api)
          # manifest     → kubernetes/<env>/<manifest>.yml stem, gke only
          # deployments  → Deployment name to wait on, gke only
          cat > all.json <<'JSON'
          [
            {"key":"bigquery-poller",   "image":"kdi-risingwv-bigquery-entity-poller",   "dir":"src/cloud-run/bigquery-entity-poller",   "target":"cloudrun-job",     "job_stem":"kdi-risingwv-bigquery-entity-poller",   "service":"", "region":"europe-west1",  "manifest":"", "deployments":""},
            {"key":"eiendom-poller",    "image":"kdi-risingwv-eiendom-entity-poller",    "dir":"src/cloud-run/eiendom-entity-poller",    "target":"cloudrun-job",     "job_stem":"kdi-risingwv-eiendom-entity-poller",    "service":"", "region":"europe-west1",  "manifest":"", "deployments":""},
            {"key":"fdvweb-poller",     "image":"kdi-risingwv-fdvweb-entity-poller",     "dir":"src/cloud-run/fdvweb-entity-poller",     "target":"cloudrun-job",     "job_stem":"kdi-risingwv-fdvweb-entity-poller",     "service":"", "region":"europe-west1",  "manifest":"", "deployments":""},
            {"key":"mysql-poller",      "image":"kdi-risingwv-mysql-entity-poller",      "dir":"src/cloud-run/mysql-entity-poller",      "target":"cloudrun-job",     "job_stem":"kdi-risingwv-mysql-entity-poller",      "service":"", "region":"europe-west1",  "manifest":"", "deployments":""},
            {"key":"superoffice-poller","image":"kdi-risingwv-superoffice-entity-poller","dir":"src/cloud-run/superoffice-entity-poller","target":"cloudrun-job",     "job_stem":"kdi-risingwv-superoffice-entity-poller","service":"", "region":"europe-west1",  "manifest":"", "deployments":""},
            {"key":"webhook-dedup",     "image":"kdi-risingwv-webhook-dedup-cleanup",    "dir":"src/cloud-run/webhook-dedup-cleanup",    "target":"cloudrun-job",     "job_stem":"kdi-risingwv-webhook-dedup-cleanup",    "service":"", "region":"europe-west1",  "manifest":"", "deployments":""},
            {"key":"data-api",          "image":"kdi-risingwv-data-api",                 "dir":"src/cloud-run/risingwave-data-api",      "target":"cloudrun-service", "job_stem":"", "service":"kdi-risingwave-data-api", "region":"europe-north1", "manifest":"", "deployments":""},
            {"key":"pubsub-writer",     "image":"kdi-risingwv-pubsub-writer",            "dir":"src/cloud-run/pubsub-writer",            "target":"gke",              "job_stem":"", "service":"", "region":"",              "manifest":"kdi-pubsub-writer",       "deployments":"kdi-pubsub-writer"},
            {"key":"sink-error",        "image":"kdi-risingwv-sink-error-collector",     "dir":"src/cloud-run/sink-error-collector",     "target":"gke",              "job_stem":"", "service":"", "region":"",              "manifest":"kdi-sink-error-collector","deployments":"kdi-sink-error-collector"},
            {"key":"dalux-poller",      "image":"kdi-risingwv-dalux-entity-poller",      "dir":"src/cloud-run/dalux-entity-poller",      "target":"cloudrun-job",     "job_stem":"kdi-risingwv-dalux-entity-poller",      "service":"", "region":"europe-west1",  "manifest":"", "deployments":""}
          ]
          JSON

          # Fail loudly rather than emit a matrix GitHub would silently reject.
          python3 -c "import json,sys; json.load(open('all.json'))" \
            || { echo '::error::all.json is not valid JSON'; exit 1; }

          {
            echo "all=$(jq -c '.' all.json)"
            echo "promotable=$(jq -c '.' all.json)"
          } >> "$GITHUB_OUTPUT"

          echo "### Deployables" >> "$GITHUB_STEP_SUMMARY"
          echo "| app | target | dev | staging/prod |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "| \(.key) | \(.target) | yes | yes |"' \
            all.json >> "$GITHUB_STEP_SUMMARY"

  # ── Does this change anything deployable? ─────────────────────────────────
  # ONE rule for every environment. Development and release used to disagree
  # about the same change, which is the bug this exists to remove:
  #
  #   PR #10  dbt models + workflows only, merged to `release` → rebuilt all
  #           ten images, redeployed staging, parked nine production approvals
  #           for an artifact byte-identical to the one already running.
  #   PR #14  one file, scripts/grant_privileges_risingwave.sql, merged to
  #           `main` → rebuilt and redeployed all ten apps to development,
  #           because `scripts/**` was missing from the old exclusion list —
  #           while the release path correctly called it non-deployable.
  #
  # The filter lives HERE, in a job, and deliberately NOT as `paths-ignore`
  # on the `pull_request` trigger. `check-version-label` runs off that same
  # trigger, and a path-filtered check does not report at all — it never goes
  # green. The moment anyone marks it a required status check, a filtered PR
  # would deadlock this branch permanently. Gating jobs instead keeps the
  # check reporting on every PR, and keeps the release tag being cut. The
  # development jobs are gated on this same output, so the two paths cannot
  # drift apart again.
  #
  # ⚠️ This is an ALLOWLIST: only `src/**` and `kubernetes/**` deploy. That is
  # a deliberate narrowing — anything else is assumed not to affect the ten
  # images, so a build-relevant path added OUTSIDE these two roots (a
  # Directory.Build.props, a global.json, a change to KdiRisingWave.sln
  # alone) will NOT rebuild. If that happens, either add the root here or use
  # the manual `workflow_dispatch` below. `kubernetes/**` is in the list
  # because a manifest change must still reach PRODUCTION: drift-check
  # re-applies manifests on development and staging only.
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deployable: ${{ steps.detect.outputs.deployable }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # workflow_dispatch is an explicit human request to build and is
          # never second-guessed. `push` and `pull_request` are both filtered,
          # by the SAME rule — dev and release disagreeing about the same
          # change is exactly the bug this replaces.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — explicit request, treating as deployable"
            exit 0
          fi

          # Fail OPEN throughout: if the file list cannot be read we build. The
          # cost of a needless build is a runner; the cost of a wrongly skipped
          # one is a change that silently never reaches an environment.
          # The two endpoints return DIFFERENT SHAPES, and one jq expression
          # cannot serve both: `pulls/{n}/files` returns an ARRAY, `compare`
          # returns an OBJECT with a `.files` key. `.files` applied to an array
          # is a jq ERROR ("expected an object but got: array"), not null — so
          # a `(.files // .)` fallback fails on every pull_request, trips the
          # fail-open branch below and rebuilds everything. Keep them separate.
          if [ "$EVENT" = "pull_request" ]; then
            SOURCE="repos/$REPO/pulls/$PR/files"
            FILTER='.[].filename'
          else
            # A push: diff the pushed range. A new branch or a force-push
            # reports an all-zero `before`, which compare cannot resolve — so
            # build rather than guess.
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::notice::no usable before-sha for this push — assuming deployable"
              echo "deployable=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SOURCE="repos/$REPO/compare/$BEFORE...$AFTER"
            FILTER='.files[].filename'
          fi

          if ! gh api --paginate "$SOURCE" --jq "$FILTER" > changed.txt; then
            echo "::warning::could not list changed files — assuming deployable"
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import os

          # The only two roots that produce or deploy the ten .NET apps:
          #   src/**        every matrix app's `dir`
          #   kubernetes/** the manifests the two GKE apps are applied from
          DEPLOYABLE_ROOTS = ("src/", "kubernetes/")

          def deployable(path):
              # A README beside the code changes no image — same reasoning as
              # the `**/*.md` entry in the push trigger's paths-ignore.
              if path.endswith(".md"):
                  return False
              return path.startswith(DEPLOYABLE_ROOTS)

          changed = [line.strip() for line in open("changed.txt") if line.strip()]
          hits = sorted(p for p in changed if deployable(p))
          verdict = "true" if hits else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"deployable={verdict}\n")

          lines = [
              "### Deployable change detection",
              "",
              "| | |",
              "|---|---|",
              f"| Changed files | {len(changed)} |",
              f"| Under `src/` or `kubernetes/` | {len(hits)} |",
              f"| Verdict | `deployable={verdict}` |",
              "",
          ]
          if hits:
              lines += ["Deployable paths:", ""]
              lines += [f"- `{p}`" for p in hits[:20]]
              if len(hits) > 20:
                  lines.append(f"- …and {len(hits) - 20} more")
          else:
              lines.append(
                  "Nothing under `src/` or `kubernetes/`. Build and deploy are "
                  "skipped for this environment. A merge into `release` still "
                  "cuts its version tag."
              )
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          PY

  # ════════════════════════════════════════════════════════════════════════════
  # push → main: build + deploy to development
  # ════════════════════════════════════════════════════════════════════════════

  build-development:
    needs: [apps, changes]
    if: needs.changes.outputs.deployable == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.all) }}
    name: Development · build (${{ matrix.app.key }})
    uses: "klpkonsern/klpe-actions/.github/workflows/backend-worker-cd.yml@v2"
    with:
      environment: development
      deploy_target: ${{ matrix.app.target }}
      worker_name: ${{ matrix.app.image }}
      dockerfile: ${{ matrix.app.dir }}/Dockerfile
      project_dir: ${{ matrix.app.dir }}
      configuration: Debug
      mode: build
    secrets: inherit

  deploy-development:
    needs: [apps, build-development, changes]
    if: needs.changes.outputs.deployable == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.all) }}
    name: Development · deploy (${{ matrix.app.key }})
    permissions:
      contents: read
      deployments: write
    uses: "klpkonsern/klpe-actions/.github/workflows/backend-worker-cd.yml@v2"
    with:
      environment: development
      deploy_target: ${{ matrix.app.target }}
      worker_name: ${{ matrix.app.image }}
      image_tag: ${{ needs.build-development.outputs.image_tag }}
      # Cloud Run jobs carry a per-environment suffix; the expression collapses
      # to "" for the gke and service entries, which ignore this input anyway.
      job_name: ${{ matrix.app.job_stem && format('{0}-dev', matrix.app.job_stem) || '' }}
      service_name: ${{ matrix.app.service }}
      region: ${{ matrix.app.region }}
      manifest_name: ${{ matrix.app.manifest }}
      deployments: ${{ matrix.app.deployments }}
      shared_dependencies: ${{ matrix.app.target == 'gke' && 'configmap/ca-pemstore configmap/dotnet-config configmap/region-config configmap/vault-kdi-options-config secret/gcp.kdi.files secret/vault-options-secret' || '' }}
      mode: deploy
    secrets: inherit
