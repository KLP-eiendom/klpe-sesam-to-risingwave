          - {
              contactid: 7867,
              dunsnr: 562231845,
              orgnr: "123",
              kredittrating: "AA",
              betalingsanmerkning: "Akseptabel",
              soliditet: 0.1747,
              aarsregnskap: "2022-12",
              okonomiskforhold_sistvurdert: "2023-07-11 00:00:00",
              mvaregistrert: "ja",
              sperret: false,
              d365kommentar: "Test",
              revisor: "DELOITTE AS",
              revisorkommentar: "Årsoppgjøret er ikke avgitt innen lovens frist",
              sanksjonert: null,
              underavvikling: null,
              konsernintern: false,
            }
    expect:
      rows:
        - {
            "ContactId": 7867,
            "Dunsnr": 562231845,
            "Orgnummer": "123",
            "Kredittrating": "AA",
            "Betanmerkning": "Akseptabel",
            "Soliditet": 0.1747,
            "Aarsregnskap": "2022-12",
            "Okonomiskforhold": "2023-07-11 00:00:00",
            "MvaRegistrert": "ja",
            "Sperret": false,
            "D365Kommentar": "Test",
            "Revisor": "DELOITTE AS",
            "RevisorKommentar": "Årsoppgjøret er ikke avgitt innen lovens frist",
            "Sanksjonert": null,
            "Underavvikling": null,
            "Konsernintern": false,
