  # A vendor Bisnode hasn't DUNS-matched yet (dunsnr null) must still post its D365-sourced
  # fields (Sperret, D365Kommentar, Orgnummer) to SuperOffice — confirmed real case:
  # d365_leverandor_id 502782, leverandorsperre cleared in D365, but the row was filtered
  # out entirely by the old `WHERE dunsnr IS NOT NULL`, so SuperOffice stayed "sperret"
  # forever. Only Bisnode-sourced fields should be null, not the whole row.
  - name: snk_leverandorvurdering_superoffice__posts_d365_fields_without_dunsnr
    model: snk_leverandorvurdering_superoffice
    given:
      - input: ref('mrt_global_leverandorvurdering')
        rows:
          - {
              contactid: 10219,
              dunsnr: null,
              orgnr: "913063279",
              kredittrating: null,
              betalingsanmerkning: null,
              soliditet: null,
              aarsregnskap: null,
              okonomiskforhold_sistvurdert: null,
              mvaregistrert: null,
              sperret: false,
              d365kommentar: null,
              revisor: null,
              revisorkommentar: null,
              sanksjonert: null,
              underavvikling: false,
              konsernintern: false,
            }
    expect:
      rows:
        - {
            "ContactId": 10219,
            "Dunsnr": null,
            "Orgnummer": "913063279",
            "Kredittrating": null,
            "Betanmerkning": null,
            "Soliditet": null,
            "Aarsregnskap": null,
            "Okonomiskforhold": null,
            "MvaRegistrert": null,
            "Sperret": false,
            "D365Kommentar": null,
            "Revisor": null,
            "RevisorKommentar": null,
            "Sanksjonert": null,
            "Underavvikling": false,
            "Konsernintern": false,
          }

