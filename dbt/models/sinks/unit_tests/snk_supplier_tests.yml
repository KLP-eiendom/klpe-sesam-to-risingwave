  - name: snk_leverandor_dalux__matched_vendor_carries_company_id
    description: >
      The update branch: a vendor with a Dalux company emits, carrying Dalux's own
      companyId so pubsub-writer can PATCH /2.1/companies/{companyId}. The current
      user-defined-field envelope rides along untouched — the writer replaces only
      the mapped values inside it.
    model: snk_leverandor_dalux
    given:
      - input: ref('mrt_leverandor_dalux_writeback')
        rows:
          - organisationid: "502003"
            name: "UPS Norway AS"
            address_road: "Postboks 228 Alnabru"
            address_zipcode: "0614"
            address_city: "OSLO"
            phoneno: ~
            email: ~
            klassifisering: "Ikke godkjent"
            organisasjonsnummer: "921000015"
            lokasjon: "Oslo"
            evalueringskommentar: "Vurdert 2026"
            isactive: false
      - input: ref('stg_dalux_leverandor')
        rows:
          - companyid: "2"
            organisationid: "502003"
            userdefinedfields: '{"items":[{"name":"Klassifisering","values":[{"text":"Godkjent"}]}]}'
    expect:
      rows:
        - companyId: "2"
          name: "UPS Norway AS"
          phoneNo: ~
          email: ~
          isActive: false
          address_road: "Postboks 228 Alnabru"
          address_zipcode: "0614"
          address_city: "OSLO"
          klassifisering: "Ikke godkjent"
          organisasjonsnummer: "921000015"
          lokasjon: "Oslo"
          evalueringskommentar: "Vurdert 2026"
          userDefinedFields: '{"items":[{"name":"Klassifisering","values":[{"text":"Godkjent"}]}]}'

  - name: snk_leverandor_dalux__vendor_without_dalux_company_does_not_emit
    description: >
      Creation is not wired up, so a vendor Dalux doesn't know must produce no
      message at all — that is what the INNER JOIN is for.
    model: snk_leverandor_dalux
    given:
      - input: ref('mrt_leverandor_dalux_writeback')
        rows:
          - organisationid: "509999"
            name: "Ikke i Dalux AS"
            isactive: true
      - input: ref('stg_dalux_leverandor')
        rows:
          - companyid: "2"
            organisationid: "502003"
            userdefinedfields: ~
    expect:
      rows: []

  - name: snk_leverandor_dalux__duplicate_organisation_id_does_not_emit
    description: >
      An organisationId held by two Dalux companies would otherwise fan out into two
      PATCHes against arbitrary duplicates. The vendor is dropped instead, and stays
      visible as a vendor Dalux never gets updated.
    model: snk_leverandor_dalux
    given:
      - input: ref('mrt_leverandor_dalux_writeback')
        rows:
          - organisationid: "502003"
            name: "UPS Norway AS"
            isactive: true
      - input: ref('stg_dalux_leverandor')
        rows:
          - companyid: "2"
            organisationid: "502003"
            userdefinedfields: ~
          - companyid: "99"
            organisationid: "502003"
            userdefinedfields: ~
    expect:
      rows: []
