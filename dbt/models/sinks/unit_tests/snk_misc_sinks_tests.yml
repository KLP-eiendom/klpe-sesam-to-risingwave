unit_tests:
  # Sesam usercustomer-bq parity: kunde_id = USER-webhook side contactId only (su_contactId),
  # retired excluded, valid email.
  - name: snk_usercustomer_bq__sesam_parity
    model: snk_usercustomer_bq
    given:
      - input: ref('mrt_global_user')
        rows:
          - {
              personId: 15133,
              bruker_id: "tor.fossum@example.com",
              su_contactId: 9,
              retired: false,
              _deleted: false,
              contactNumber: "C-00042",
            }
          # csuser-only row (no user-webhook contactId) -> dropped
          - {
              personId: 35074,
              bruker_id: "kari.test@example.com",
              su_contactId: null,
              retired: false,
              _deleted: false,
              contactNumber: "C-00099",
            }
          # retired -> dropped
          - {
              personId: 10010,
              bruker_id: "advokat@example.com",
              su_contactId: 5571,
              retired: true,
              _deleted: false,
              contactNumber: null,
            }
    expect:
      rows:
        - {
            so_id: "15133",
            bruker_id: "tor.fossum@example.com",
            kunde_id: "9",
            kundenummer: "C-00042",
          }

