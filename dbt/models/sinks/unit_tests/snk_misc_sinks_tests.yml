              bygg_avdeling_id: "N21102",
              bf_firma_navn: "KLP Ibsenkvartalet AS",
              bf_orgnummer: "987988142",
              GnrBnr: "208/529",
              b_adresse: "C.J. Hambros Plass 2\nOSLO\nNOR"
