  - name: snk_user_leko__pass_through
    model: snk_user_leko
    given:
      - input: ref('mrt_user_leko')
        rows:
          - { id: 1, email: "test@example.com" }
    expect:
      rows:
        - { id: 1, email: "test@example.com" }

  - name: snk_kontrakt_leko__sesam_parity
    model: snk_kontrakt_leko
    given:
      - input: ref('mrt_leko_kontrakt')
        rows:
          - "#id": "ID1"
            payload: '{"_id":"C1","contractId":"CID1","id":"ID1","startDate":"2020-01-01 00:00:00","endDate":"2025-01-01 00:00:00"}'
    expect:
      rows:
        - "#id": "ID1"
          payload: '{"_id":"C1","contractId":"CID1","id":"ID1","startDate":"2020-01-01 00:00:00","endDate":"2025-01-01 00:00:00"}'

  - name: snk_energiattest_bqeos__sesam_parity
    model: snk_energiattest_bqeos
    given:
      - input: ref('mrt_global_property')
        rows:
          - {
              bygg_avdeling_id: "D20201",
              andelfossilt: 40,
              energiforbruk: 100,
              b_navn: "Bygg Navn",
              EnergyCategory: "A",
            }
          # null EnergyCategory must STILL be emitted (Sesam keeps it; EnergiKarakter just nulls).
          # COALESCE defaults AndelFossilEl / EnergiForbruk to 0.
          - {
              bygg_avdeling_id: "N21001",
              andelfossilt: null,
              energiforbruk: null,
              b_navn: "Paleet kontor",
              EnergyCategory: null,
            }
    expect:
      rows:
        - {
            ByggNummer: "D20201",
            AndelFossilEl: 40,
            EnergiForbruk: 100,
            Navn: "Bygg Navn",
            EnergiKarakter: "A",
          }
        - {
            ByggNummer: "N21001",
            AndelFossilEl: 0,
            EnergiForbruk: 0,
            Navn: "Paleet kontor",
            EnergiKarakter: null,
          }

