  - name: snk_bygg_kundeportal__null_handling
    model: snk_bygg_kundeportal
    given:
      - input: ref('mrt_bygg_forvalter')
        rows:
          - {
              bygg_avdeling_id: "200",
              has_avdeling: true,
              bygg_id: null,
              andelfossilt: 0,
              energiforbruk: 0,
              b_gyldig_fra: null,
            }
    expect:
      rows:
        - {
            ByggId: "200",
            EnergiForbruk: 0,
            AndelFossilEl: 0,
            Created: "1970-01-01 00:00:00",
            LastUpdated: "1970-01-01 00:00:00",
          }

  # Building-only records (no bygg-avdeling) must NOT be sent to Kundeportal: Sesam keys those by
  # BuildingId/BUILDINGID (a field RW lacks), so they can't reach ID-parity here. They stay in
  # snk_bygg_forvalter/snk_bygg_bqeos only. has_avdeling=false => filtered out.
  - name: snk_bygg_kundeportal__excludes_building_only
    model: snk_bygg_kundeportal
    given:
      - input: ref('mrt_bygg_forvalter')
        rows:
          - {
              bygg_avdeling_id: "N20101",
              has_avdeling: false,
              bygg_id: "N20101",
              b_navn: "Holbergs gate 1",
              andelfossilt: 0,
              energiforbruk: 0,
            }
    expect:
      rows: []