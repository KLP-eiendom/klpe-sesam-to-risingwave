  - name: snk_customer_forvalter__dedup_duplicate_kundenummer
    model: snk_customer_forvalter
    given:
      - input: ref('mrt_global_customer')
        rows:
          - {
              kundenummer: "250001",
              navn: "NTNU, Inst. for energi- og prosessteknikk",
              contactId: 6327,
              Created: "1970-01-01 00:00:00",
              LastUpdated: "1970-01-01 00:00:00",
            }
          - {
              kundenummer: "250001",
              navn: "Ingeniørnytt AS",
              contactId: 6453,
              Created: "1970-01-01 00:00:00",
              LastUpdated: "1970-01-01 00:00:00",
            }
          - {
              kundenummer: "",
              navn: "Blank Nummer Customer",
              contactId: 9999,
              Created: "1970-01-01 00:00:00",
              LastUpdated: "1970-01-01 00:00:00",
            }
    expect:
      rows:
        - {
            Id: "6453",
            Nummer: "250001",
            Navn: "Ingeniørnytt AS",
            SuperOfficeContactId: 6453,
          }

  - name: snk_customer_leko__pass_through
    model: snk_customer_leko
    given:
      - input: ref('mrt_customer_leko')
        rows:
          - { Id: 15368, name: "Test Customer" }
    expect:
      rows:
        - { Id: 15368, name: "Test Customer" }