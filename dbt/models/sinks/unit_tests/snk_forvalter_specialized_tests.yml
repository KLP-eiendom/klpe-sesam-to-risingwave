  - name: snk_prosjektbudsjett_forvalter__sesam_parity
    model: snk_prosjektbudsjett_forvalter
    given:
      - input: ref('stg_d365_prosjektbudsjett')
        rows:
          # BelopFastValutakurs must come from belop_firmavaluta (as Sesam's DTL maps it),
          # NOT the identically-named belop_fast_valutakurs. Distinct values prove the column choice.
          - {
              _id: "24|N228|Pros.03-11300-N22801-EIER-2024-12-31",
              prosjekt_id: "24|N228|Pros.03",
              firma_id: "N228",
              konto_id: "11300",
              bygg_avdeling_id: "N22801",
              kontnadsted_id: "EIER",
              budsjettdato: "2024-12-31",
              belop_firmavaluta: 200000.0,
              belop_fast_valutakurs: 273000.0,
            }
          # negative case: Sesam filters KontoId == '-' — must be dropped, absent from expect
          - {
              _id: "24|N228|Pros.03--N22801-EIER-2024-12-31",
              prosjekt_id: "24|N228|Pros.03",
              firma_id: "N228",
              konto_id: "-",
              bygg_avdeling_id: "N22801",
              kontnadsted_id: "EIER",
              budsjettdato: "2024-12-31",
            }
    expect:
      rows:
        - {
            Id: "24|N228|Pros.03-11300-N22801-EIER-2024-12-31",
            FirmaId: "N228",
            KontoId: "11300",
            ByggAvdelingId: "N22801",
            Budsjettdato: "2024-12-31",
            KontraktId: null,
            Budsjettnummer: "24|N228|Pros.03",
            Budsjettmodell: null,
            BelopFastValutakurs: 200000.0,
            BelopFastValutakursPerDato: null,
            Kommentar: null,
          }

