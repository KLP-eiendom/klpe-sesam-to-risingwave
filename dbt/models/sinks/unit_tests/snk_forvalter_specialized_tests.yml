  - name: snk_leieobjekt_forvalter__sesam_parity
    model: snk_leieobjekt_forvalter
    given:
      - input: ref('stg_d365_leieobjekt')
        rows:
          # no gyldig_til -> kept via the "gyldig_til IS NULL" guard
          - {
              id: 5637145326,
              leieobjekt_id: 5637145326,
              navn: "07 Kontor 326kvm",
              bygg: "N20101",
              utleieobjekt_type: "Bygg",
            }
          # expired (_is_active false, gyldig_til in the past) -> dropped, mirroring
          # Sesam's "gyldig_til IS NULL OR gyldig_til > now()" filter
          - {
              id: "N99999L9",
              leieobjekt_id: 9999999999,
              navn: "Expired Object",
              bygg: "N99999",
              utleieobjekt_type: "Bygg",
              gyldig_til: "2020-01-01 00:00:00",
              _is_active: false,
            }
    expect:
      rows:
        - {
            Id: 5637145326,
            Navn: "07 Kontor 326kvm",
            Bygg: "N20101",
            Type: "Bygg",
            ForvalterId: null,
            DrifterId: null,
            OekonomId: null,
            GyldigFra: null,
            GyldigTil: null,
          }

