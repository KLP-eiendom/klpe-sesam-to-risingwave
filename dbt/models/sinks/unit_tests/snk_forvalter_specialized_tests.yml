  - name: snk_user_person_forvalter__sesam_parity
    model: snk_user_person_forvalter
    given:
      - input: ref('mrt_global_user')
        rows:
          - {
              personId: 34770,
              contactId: 11251,
              email: "jon.arild@example.com",
              firstName: "John Arild",
              lastName: "Myhrvold",
              registered: "1996-04-23T10:11:10Z",
            }
          - {
              personId: 19880,
              contactId: 5,
              email: "bjorn@example.com",
              firstName: "Anne-Live",
              lastName: "Bjørnstad",
              registered: null,
            }
          - {
              # user-webhook-only person — never appeared under the old
              # stg_superoffice_csuser-only sink; proves the mrt_global_user switch works.
              personId: 42001,
              contactId: 200,
              email: "eva.olsen@example.com",
              firstName: "Eva",
              lastName: "Olsen",
              registered: "2022-01-01T00:00:00Z",
            }
          - {
              # contactId=0 means "no contact" per Sesam's filter(gt(_,0), ...) — must be
              # excluded, not treated as a present contact by a naive IS NOT NULL check.
              personId: 42002,
              contactId: 0,
              email: "noone@example.com",
              firstName: "No",
              lastName: "One",
              registered: null,
            }
      - input: ref('mrt_global_customer')
        rows:
          # Kundenummer comes from a global-customer hop by contactId (gc.number), not
          # csuser's own contactNumber field — contactId 11251/200 have no matching customer.
          - { contactid: 5, kundenummer: "107061" }
    expect:
      rows:
        - {
            Id: "34770-jon.arild@example.com",
            SoPersonId: 34770,
            SoContactId: 11251,
            Epost: "jon.arild@example.com",
            Navn: "John Arild Myhrvold",
            Kundenummer: null,
            Created: "1996-04-23 10:11:10",
          }
        - {
            Id: "19880-bjorn@example.com",
            SoPersonId: 19880,
            SoContactId: 5,
            Epost: "bjorn@example.com",
            Navn: "Anne-Live Bjørnstad",
            Kundenummer: "107061",
            Created: "1970-01-01 00:00:00",
          }
        - {
            Id: "42001-eva.olsen@example.com",
            SoPersonId: 42001,
            SoContactId: 200,
            Epost: "eva.olsen@example.com",
            Navn: "Eva Olsen",
            Kundenummer: null,
            Created: "2022-01-01 00:00:00",
          }

  # SuperOffice data quality occasionally duplicates a customer's Kundenummer onto a
  # department/branch contact (e.g. "Skatteetaten avd Bergen", contactId 18327) that
  # shouldn't be treated as authoritative — confirmed real case: kundenummer 600335,
  # contactId 8636 is the real company, 18327 is its Bergen department. A person linked
  # to the department contactId must NOT resolve Kundenummer (matches Sesam).
  - name: snk_user_person_forvalter__excludes_department_contact
    model: snk_user_person_forvalter
    given:
      - input: ref('mrt_global_user')
        rows:
          - {
              personId: 50001,
              contactId: 8636,
              email: "hovedkontakt@example.com",
              firstName: "Hoved",
              lastName: "Kontakt",
              registered: null,
            }
          - {
              personId: 50002,
              contactId: 18327,
              email: "bergen@example.com",
              firstName: "Bergen",
              lastName: "Avdeling",
              registered: null,
            }
      - input: ref('mrt_global_customer')
        rows:
          - { contactid: 8636, kundenummer: "600335", department: "" }
          - { contactid: 18327, kundenummer: "600335", department: "Bergen" }
    expect:
      rows:
        - {
            Id: "50001-hovedkontakt@example.com",
            SoPersonId: 50001,
            SoContactId: 8636,
            Epost: "hovedkontakt@example.com",
            Navn: "Hoved Kontakt",
            Kundenummer: "600335",
            Created: "1970-01-01 00:00:00",
          }
        - {
            Id: "50002-bergen@example.com",
            SoPersonId: 50002,
            SoContactId: 18327,
            Epost: "bergen@example.com",
            Navn: "Bergen Avdeling",
            Kundenummer: null,
            Created: "1970-01-01 00:00:00",
          }

  # A contact that has a department filled in but is the ONLY contact for its kundenummer
  # (no non-department sibling) is a normal single contact, not a duplicate — its
  # Kundenummer must NOT be nulled out just because department happens to be set.
  - name: snk_user_person_forvalter__keeps_kundenummer_for_lone_department_contact
    model: snk_user_person_forvalter
    given:
      - input: ref('mrt_global_user')
        rows:
          - {
              personId: 50003,
              contactId: 40001,
              email: "innkjop@example.com",
              firstName: "Inn",
              lastName: "Kjop",
              registered: null,
            }
      - input: ref('mrt_global_customer')
        rows:
          - { contactid: 40001, kundenummer: "700001", department: "Innkjøp" }
    expect:
      rows:
        - {
            Id: "50003-innkjop@example.com",
            SoPersonId: 50003,
            SoContactId: 40001,
            Epost: "innkjop@example.com",
            Navn: "Inn Kjop",
            Kundenummer: "700001",
            Created: "1970-01-01 00:00:00",
          }

  # Sesam prioritizes the SO user webhook's own fullName over a firstName+lastName concat —
  # avoids reconstruction artifacts (e.g. a double space) when the split fields don't cleanly
  # recombine.
  - name: snk_user_person_forvalter__navn_prefers_fullname
    model: snk_user_person_forvalter
    given:
      - input: ref('mrt_global_user')
        rows:
          - {
              personId: 10606,
              contactId: 300,
              email: "kristian@example.com",
              fullName: "Kristian Hogstad Lund",
              firstName: "Kristian Hogstad ",
              lastName: "Lund",
              registered: null,
            }
      - input: ref('mrt_global_customer')
        rows: []
    expect:
      rows:
        - {
            Id: "10606-kristian@example.com",
            SoPersonId: 10606,
            SoContactId: 300,
            Epost: "kristian@example.com",
            Navn: "Kristian Hogstad Lund",
            Kundenummer: null,
            Created: "1970-01-01 00:00:00",
          }

