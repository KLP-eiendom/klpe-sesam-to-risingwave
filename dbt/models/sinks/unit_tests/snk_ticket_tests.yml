unit_tests:
  - name: snk_ticket_kundeportal__sesam_parity
    model: snk_ticket_kundeportal
    given:
      - input: ref('mrt_superoffice_ticket')
        rows:
          - {
              ticketid: 255,
              createdat: "2020-07-23 10:12:21Z",
              lastchanged: "2020-07-23 12:06:46Z",
              ticketcategoryid: 7,
              title: "Integration test of Ticket create with message",
              ticketstatusid: 1,
              author: "per.olsen@example.com",
              personId: 100,
              closedat: null,
              contactid: 2,
            }
      - input: ref('mrt_global_customer')
        rows:
          - { contactid: 2, kundenummer: "101219" }
      - input: ref('mrt_superoffice_user')
        rows:
          - { personId: 100, email: "per.olsen@example.com" }
      - input: ref('mrt_global_ticketcategory')
        rows:
          - { SakskategoriId: 7, System: "superoffice", Type: "property", Id: 7 }
    expect:
      rows:
        - {
            "#id": "255",
            Created: "2020-07-23 10:12:21Z",
            LastUpdated: "2020-07-23 12:06:46Z",
            EksternSakId: "255:superoffice-ticket",
            SakskategoriId: 7,
            Emne: "Integration test of Ticket create with message",
            Status: "1",
            OpprettetAv: "per.olsen@example.com",
            LukketDato: null,
            SoContactId: 2,
            KundeNummer: "101219",
          }

