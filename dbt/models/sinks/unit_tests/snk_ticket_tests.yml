              ticketid: 23332,
              createdat: "2020-09-11 12:05:11Z",
              lastchanged: "2020-09-11 12:42:33Z",
              supportcategoryname: "Annet",
            }
          - {
              ticketid: 11395,
              createdat: "2018-04-24 07:09:13Z",
              lastchanged: "2018-05-02 05:50:59Z",
              supportcategoryname: "Sikkerhet",
            }
          - {
              ticketid: 99999,
