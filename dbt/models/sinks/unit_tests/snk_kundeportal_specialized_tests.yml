  - name: snk_ticketmessageattachment_kundeportal__sesam_parity
    description: >
      Attachments can arrive via either source of the FULL OUTER JOIN — the
      superoffice-ticketmessage-update webhook (camelCase attachment fields,
      e.g. attachmentId) or the ticket webhook's embedded TicketMessages[]
      (PascalCase, e.g. AttachmentId) — both must be handled.
    model: snk_ticketmessageattachment_kundeportal
    given:
      - input: ref('mrt_superoffice_ticketmessage_update')
        rows:
          - {
              ticketmessageid: 500,
              externalid: "500:superoffice-ticketmessage",
              slevel: "External",
              createdat: "2021-01-01 10:00:00",
              _deleted: false,
              ticketattachments: '[{"attachmentId": 1080, "contentType": "image/png", "name": "test.png", "attSize": 1024}]',
            }
      - input: ref('mrt_superoffice_ticketmessage')
        rows:
          - {
              ticketmessageid: 600,
              externalid: "600:superoffice-ticketmessage",
              slevel: "External",
              createdat: "2022-02-02 11:00:00",
              _deleted: false,
              ticketattachments: '[{"AttachmentId": 1090, "ContentType": "application/pdf", "Name": "doc.pdf", "AttSize": 2048}]',
            }
          # Attachment on an Internal message: filter is inherited from the parent
          # message's Slevel, so this attachment must never reach Kundeportal. DROP.
          - {
              ticketmessageid: 610,
              externalid: "610:superoffice-ticketmessage",
              slevel: "Internal",
              createdat: "2022-02-02 11:00:00",
              _deleted: false,
              ticketattachments: '[{"AttachmentId": 1095, "ContentType": "application/pdf", "Name": "internal-only.pdf", "AttSize": 4096}]',
            }
    expect:
      rows:
        - {
            EksternId: "1080:superoffice-ticketmessageattachment",
            EksternSaksmeldingId: "500:superoffice-ticketmessage",
            Type: "image/png",
            FileName: "test.png",
            FileSize: 1024,
            Created: "2021-01-01 10:00:00",
            LastUpdated: "2021-01-01 10:00:00",
          }
        - {
            EksternId: "1090:superoffice-ticketmessageattachment",
            EksternSaksmeldingId: "600:superoffice-ticketmessage",
            Type: "application/pdf",
            FileName: "doc.pdf",
            FileSize: 2048,
            Created: "2022-02-02 11:00:00",
            LastUpdated: "2022-02-02 11:00:00",
          }

  - name: snk_ticketmessageattachment_kundeportal__float_attsize
    description: >
      SuperOffice sometimes sends AttSize as a float-formatted string (e.g. "50.0")
      instead of a plain integer. A direct ::BIGINT cast fails ("invalid digit found
      in string") — must go through ::NUMERIC first so both forms parse cleanly.
    model: snk_ticketmessageattachment_kundeportal
    given:
      - input: ref('mrt_superoffice_ticketmessage_update')
        rows:
          - {
              ticketmessageid: 800,
              externalid: "800:superoffice-ticketmessage",
              slevel: "External",
              createdat: "2021-01-01 10:00:00",
              _deleted: false,
              ticketattachments: '[{"attachmentId": 1300, "contentType": "application/pdf", "name": "float-size.pdf", "attSize": "50.0"}]',
            }
      - input: ref('mrt_superoffice_ticketmessage')
        rows: []
    expect:
      rows:
        - {
            EksternId: "1300:superoffice-ticketmessageattachment",
            EksternSaksmeldingId: "800:superoffice-ticketmessage",
            Type: "application/pdf",
            FileName: "float-size.pdf",
            FileSize: 50,
            Created: "2021-01-01 10:00:00",
            LastUpdated: "2021-01-01 10:00:00",
          }

  - name: snk_ticketmessageattachment_kundeportal__strips_non_bmp_filename
    description: >
      Kundeportal's VedleggSak.FileName column isn't utf8mb4, so 4-byte UTF-8
      characters (emoji, etc.) in an attachment name must be stripped before
      the JDBC sink writes it, or MySQL rejects the row ("Incorrect string value").
    model: snk_ticketmessageattachment_kundeportal
    given:
      - input: ref('mrt_superoffice_ticketmessage_update')
        rows:
          - {
              ticketmessageid: 700,
              externalid: "700:superoffice-ticketmessage",
              slevel: "External",
              createdat: "2021-01-01 10:00:00",
              _deleted: false,
              ticketattachments: '[{"attachmentId": 1200, "contentType": "application/pdf", "name": "😊 bilde.pdf", "attSize": 512}]',
            }
      - input: ref('mrt_superoffice_ticketmessage')
        rows: []
    expect:
      rows:
        - {
            EksternId: "1200:superoffice-ticketmessageattachment",
            EksternSaksmeldingId: "700:superoffice-ticketmessage",
            Type: "application/pdf",
            FileName: " bilde.pdf",
            FileSize: 512,
            Created: "2021-01-01 10:00:00",
            LastUpdated: "2021-01-01 10:00:00",
          }

  - name: snk_ticketstatus_kundeportal__sesam_parity
    description: >
      Real staging shape: _id is the synthetic poller key '<id>_superoffice',
      status holds the English status code ('Active'), name the localized label
      ('Aktiv'). Sesam ticketstatus-kundeportal maps Kode=status, Navn=name,
      System='superoffice' (constant). Kode must NOT be _id.
    model: snk_ticketstatus_kundeportal
    given:
      - input: ref('stg_superoffice_ticketstatus')
        rows:
          - {
              ticketStatusId: 1,
              _id: "1_superoffice",
              name: "Aktiv",
              status: "Active",
            }
    expect:
      rows:
        - {
            SakstatusId: 1,
            Kode: "Active",
            Navn: "Aktiv",
            System: "superoffice",
          }


