  - name: snk_kunde_orgnummer_kundeportal__sesam_parity
    model: snk_kunde_orgnummer_kundeportal
    given:
      - input: ref('mrt_global_customer')
        rows:
          # OrgNummer must be the SO orgnr Sesam writes — NOT the dirty d365 mva_nummer.
          - { kundenummer: "600000", navn: "Ingeniørene Seim & Hultgreen A/S", mva_nummer: "NO840799522MVA", contactid: 7, orgnr: "840 799 522", category: "Kunde" }
          - { kundenummer: "600015", navn: "OsloMet Storbyuniversitet",        mva_nummer: "997058925",      contactid: 3, orgnr: "997058925",   category: null }
          # d365-only customer (no SO contact -> orgnr NULL): Sesam never emits these -> DROP.
          - { kundenummer: "600047", navn: "Statsbygg",                        mva_nummer: "971278374",      contactid: null, orgnr: null,       category: null }
          # expired SO contact (category ~ Utgått): Sesam excludes -> DROP.
          - { kundenummer: "600099", navn: "Utgått Kunde AS",                  mva_nummer: "912345678",      contactid: 99, orgnr: "912 345 678", category: "Utgått" }
          # empty KundeNavn: Sesam requires KundeNavn non-empty -> DROP.
          - { kundenummer: "600100", navn: "",                                 mva_nummer: "923456789",      contactid: 100, orgnr: "923 456 789", category: "Kunde" }
          # contactsimple category is fine, but the SO "contact" entity (poller) is Utgått: Sesam checks
          # both sources independently -> DROP. Regression test for the contactCategory fallback.
          - { kundenummer: "600101", navn: "Utgått Via Contact AS",            mva_nummer: "934567890",      contactid: 101, orgnr: "934 567 890", category: "Kunde", contactCategory: "Utgått" }
    expect:
      rows:
        - { KundeNummer: "600000", KundeNavn: "Ingeniørene Seim & Hultgreen A/S", OrgNummer: "840 799 522", SoContactId: 7, Created: "1970-01-01 00:00:00", LastUpdated: "1970-01-01 00:00:00" }
        - { KundeNummer: "600015", KundeNavn: "OsloMet Storbyuniversitet",        OrgNummer: "997058925",   SoContactId: 3, Created: "1970-01-01 00:00:00", LastUpdated: "1970-01-01 00:00:00" }

  - name: snk_kunde_orgnummer_kundeportal__dedup_duplicate_orgnr
    description: >
      Two distinct customer entities (different kundenummer, different SO contacts)
      occasionally share the same physical orgnr (subsidiaries, legacy duplicates).
      The target Kunde_Orgnummer table's upsert key is OrgNummer alone, so without a
      dedup RW silently overwrites non-deterministically. Keep the highest contactId.
    model: snk_kunde_orgnummer_kundeportal
    given:
      - input: ref('mrt_global_customer')
        rows:
          - { kundenummer: "400043", navn: "Region Stockholm SLSO", contactid: 15713, orgnr: "232100-0016", category: "Kunde" }
          - { kundenummer: "90004354", navn: "CAMM Stockholm", contactid: 12024, orgnr: "232100-0016", category: "Kunde" }
    expect:
      rows:
        - { KundeNummer: "400043", KundeNavn: "Region Stockholm SLSO", OrgNummer: "232100-0016", SoContactId: 15713, Created: "1970-01-01 00:00:00", LastUpdated: "1970-01-01 00:00:00" }


  # Sesam usercustomer-kundeportal parity: PK (SoContactId, BrukerId); contactid not null/0,
  # valid email, dedup keeps lowest personId per (contact, email) pair.
  - name: snk_usercustomer_kundeportal__sesam_parity
    model: snk_usercustomer_kundeportal
    given:
      - input: ref('mrt_global_user')
        rows:
          - { personid: 14542, contactid: 2, bruker_id: "siri.kristoffersen@example.com", email: "siri.kristoffersen@example.com", firstName: "Siri", lastName: "Kristoffersen", retired: false, _deleted: false, registered: "1970-01-01 00:00:00", updated: "1970-01-01 00:00:00" }
          - { personid: 14543, contactid: 2, bruker_id: "per.olsen@example.com",              email: "per.olsen@example.com",              firstName: "Per",  lastName: "Olsen",         retired: false, _deleted: false, registered: "1970-01-01 00:00:00", updated: "1970-01-01 00:00:00" }
          - { personid: 14546, contactid: 3, bruker_id: "eva.lunde@example.com",          email: "eva.lunde@example.com",          firstName: "Eva",   lastName: "Lunde",         retired: false, _deleted: false, registered: "1970-01-01 00:00:00", updated: "1970-01-01 00:00:00" }
          # same (contactid, bruker_id) pair with HIGHER personId -> dropped by pair dedup
          - { personid: 99999, contactid: 3, bruker_id: "eva.lunde@example.com",          email: "eva.lunde@example.com",          firstName: "Eva",   lastName: "Dup",           retired: false, _deleted: false, registered: "1970-01-01 00:00:00", updated: "1970-01-01 00:00:00" }
          # contactid 0 -> dropped (Sesam: SoContactId != 0)
          - { personid: 15926, contactid: 0, bruker_id: "service@example.com",                  email: "service@example.com",                  firstName: "service", lastName: "SOservice",  retired: false, _deleted: false, registered: "1970-01-01 00:00:00", updated: "1970-01-01 00:00:00" }
    expect:
      rows:
        - { SuperOfficeId: 14542, Created: "2024-01-01 00:00:00", LastUpdated: "2024-01-01 00:00:00", SoContactId: 2, BrukerId: "siri.kristoffersen@example.com" }
        - { SuperOfficeId: 14543, Created: "2024-01-01 00:00:00", LastUpdated: "2024-01-01 00:00:00", SoContactId: 2, BrukerId: "per.olsen@example.com" }
        - { SuperOfficeId: 14546, Created: "2024-01-01 00:00:00", LastUpdated: "2024-01-01 00:00:00", SoContactId: 3, BrukerId: "eva.lunde@example.com" }

