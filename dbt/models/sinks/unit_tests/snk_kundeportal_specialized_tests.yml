  - name: snk_contract_details_kundeportal__sesam_parity
    description: >
      The kontrakt join must resolve to the ONE owning utleier via cl.firma
      (LOWER(concat(kontrakt_nummer,'.',firma)) = LOWER(kontrakt._id)), NOT fan out across
      every utleier variant of the kontrakt_id. Decoy kontrakt 600015.20.N999 (wrong building
      WRONG99) shares kontrakt_id 600015.20 — lines with firma 'N201' must resolve to N20101,
      never WRONG99 (the ByggNummer assertions catch a regression to the loose kontrakt_id join).
      Also covers the FristOppsigelse CASE (D% building branch) and the leie_kost_gruppe_id=2 filter.
      KontraktNummer = concat(kontrakt_nummer,'.',UPPER(firma)); RentalObjectName = leie_objekt_navn;
      RentalQty = 0 when leie_enhet='m2' else leie_antall (mirrors Sesam contract-details-kundeportal).
    model: snk_contract_details_kundeportal
    given:
      - input: ref('stg_d365_contract_line')
        rows:
          - _id: "5637150425"
            unik_id: 5637150425
            kontrakt_nummer: "600015.20"
            firma: "N201"
            leie_enhet: "m2"
            leie_antall: 41005
            leie_objekt_navn: "Hotell/kongress"
            status_kode: 2
            leie_art_gruppe_n1: "Leie"
            gyldig_til: "2031-01-19 00:00:00"
            frist_oppsigelse_leietaker: "09"
            frist_oppsigelse_utleier: "09"
            lopende: "nei"
            FirstPossibleTerminationDate: "2030-01-01 00:00:00"
            FirstPossibleTerminationDateLessor: "2030-01-01 00:00:00"
          - _id: "D-BUILDING-TEST"
            unik_id: 999999
            kontrakt_nummer: "D.KONTRAKT"
            firma: "D208"
            status_kode: 2
            leie_art_gruppe_n1: "Leie"
            frist_oppsigelse_leietaker: "06"
            frist_oppsigelse_utleier: "06"
            gyldig_til: "2031-01-19 00:00:00"
            lopende: "ja"
            FirstPossibleTerminationDate: "2029-12-31 00:00:00"
            FirstPossibleTerminationDateLessor: "2029-12-31 00:00:00"
          - _id: "NON-RENTAL-TEST"
            unik_id: 777777
            kontrakt_nummer: "600015.20"
            firma: "N201"
            leie_enhet: "stk"
            leie_antall: 3
            leie_objekt_navn: "Parkering P3"
            status_kode: 2
            leie_art_gruppe_n1: "FK"
            frist_oppsigelse_leietaker: "09"
            gyldig_til: "2026-06-30 00:00:00"
          - _id: "LOPENDE-TEST"
            unik_id: 888888
            kontrakt_nummer: "600015.20"
            firma: "N201"
            status_kode: 2
            leie_art_gruppe_n1: "Leie"
            lopende: "ja"
          # leie_kost_gruppe_id = 2 => filtered out (Sesam contract-details-kundeportal); NULL is kept.
          - _id: "KOSTGRUPPE2-TEST"
            unik_id: 555555
            kontrakt_nummer: "600015.20"
            firma: "N201"
            status_kode: 2
            leie_art_gruppe_n1: "Leie"
            lopende: "nei"
            leie_kost_gruppe_id: 2
            gyldig_til: "2031-01-19 00:00:00"
      - input: ref('stg_d365_kontrakt')
        rows:
          - _id: "600015.20.N201"
            kontrakt_id: "600015.20"
            utleier_id: "N201"
            kundenummer: "600015"
            byggnummer: "N20101"
          # decoy: same kontrakt_id, different utleier/building — must NOT be picked
          - _id: "600015.20.N999"
            kontrakt_id: "600015.20"
            utleier_id: "N999"
            kundenummer: "600015"
            byggnummer: "WRONG99"
          - _id: "D.KONTRAKT.D208"
            kontrakt_id: "D.KONTRAKT"
            utleier_id: "D208"
            kundenummer: "600015"
            byggnummer: "D20801"
    expect:
      rows:
        - UniqueId: "5637150425"
          ByggNummer: "N20101"
          KontraktNummer: "600015.20.N201"
          RentalObjectName: "Hotell/kongress"
          RentalQty: 0
          FristOppsigelseLeietaker: "2030-04-19 00:00:00"
          FristOppsigelseUtleier: "2030-04-19 00:00:00"
        - UniqueId: "D-BUILDING-TEST"
          ByggNummer: "D20801"
          KontraktNummer: "D.KONTRAKT.D208"
          RentalObjectName: null
          RentalQty: 0
